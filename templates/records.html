<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收费记录</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
        .phone{width:360px;height:640px;background:#fff;position:relative;overflow:hidden}
        .top{background:#409eff;color:#fff;padding:12px 16px;display:flex;align-items:center}
        .back{width:32px;height:32px;background:#fff;color:#409eff;border-radius:6px;border:none;font-size:16px;margin-right:12px}
        .title{font-size:18px}
        .list{padding:16px}
        .item{padding:12px;border-bottom:1px solid #eee;font-size:14px}
        .tabbar{position:absolute;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0 24px;border-top:1px solid #eee}
        .tab-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#999}
        .tab-item.active{color:#409eff}
        .tab-item .icon{width:24px;height:24px;background:transparent}
    </style>
</head>
<body>
<div class="phone">
    <div class="top">
        <button class="back" onclick="location.href='/'">←</button>
        <div class="title">收费记录</div>
    </div>
    <div class="list" id="list"></div>
    <div class="tabbar">
        <div class="tab-item" onclick="location.href='/'"><div class="icon">🏠</div><div>首页</div></div>
        <div class="tab-item" onclick="location.href='/stats'"><div class="icon">👤</div><div>我的</div></div>
    </div>
</div>
<script>
async function load(){let r=await fetch('/api/records');let d=await r.json();let list=document.getElementById('list');d.forEach(x=>{let div=document.createElement('div');div.className='item';div.innerText=`${x.plate} 车位${x.spot_id} | 费用${x.fee}元`;list.appendChild(div)})}
load()
</script>
</body>
</html>
