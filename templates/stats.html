<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone {
            width: 360px;
            height: 640px;
            background: #fff;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .top {
            background: #409eff;
            color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
        }
        .back-btn {
            width: 32px;
            height: 32px;
            background: #fff;
            color: #409eff;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .title {
            font-size: 20px;
            font-weight: 500;
        }
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .empty-box {
            text-align: center;
            color: #909399;
        }
        .empty-box .icon {
            font-size: 60px;
            margin-bottom: 16px;
            color: #c0c4cc;
        }
        .empty-box .text {
            font-size: 16px;
            margin-bottom: 8px;
        }
        .empty-box .desc {
            font-size: 14px;
            color: #c0c4cc;
        }
        canvas {
            width: 100% !important;
            height: 350px !important;
            display: none;
        }
        .tabbar {
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 24px;
            border-top: 1px solid #f2f3f5;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #909399;
            cursor: pointer;
        }
        .tab-item.active {
            color: #409eff;
        }
        .tab-item .icon {
            width: 24px;
            height: 24px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="top">
            <button class="back-btn" onclick="location.href='/'">←</button>
            <div class="title">数据统计</div>
        </div>

        <div class="content">
            <!-- 没数据时显示这个 -->
            <div class="empty-box" id="empty">
                <div class="icon">📊</div>
                <div class="text">暂无停车数据</div>
                <div class="desc">产生停车记录后将自动显示图表</div>
            </div>

            <!-- 有数据时自动显示这个 -->
            <canvas id="incomeChart"></canvas>
        </div>

        <div class="tabbar">
            <div class="tab-item" onclick="location.href='/'">
                <div class="icon">🏠</div>
                <div>首页</div>
            </div>
            <div class="tab-item active" onclick="location.href='/stats'">
                <div class="icon">👤</div>
                <div>我的</div>
            </div>
        </div>
    </div>

<script>
    const ctx = document.getElementById('incomeChart').getContext('2d');
    const empty = document.getElementById('empty');
    const canvas = document.getElementById('incomeChart');

    // 这里是真实接口，没数据就显示空状态
    fetch('/stats_data')
        .then(res => res.json())
        .then(data => {
            if (!data || data.datasets[0].data.every(v => v === 0)) {
                empty.style.display = 'block';
                canvas.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            canvas.style.display = 'block';

            new Chart(ctx, {
                type: 'bar',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        });
</script>
</body>
</html>
