<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>停车更方便</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #f0f2f5; /* Changed background to make phone pop */
            display: flex;
            justify-content: center;
            align-items: center; /* Corrected alignment property */
            height: 100vh;
        }
        .mobile-frame {
            background: #111;
            padding: 10px; /* Reduced border thickness */
            border-radius: 35px; /* Adjusted for new padding */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); /* Softened shadow */
        }
        .phone {
            width: 360px;
            height: 780px; /* Changed from 640px to match 19.5:9 ratio */
            background: #5cadff; /* A lighter blue background */
            overflow: hidden;
            position: relative;
            border-radius: 25px; /* Adjusted to fit inside the frame */
            display: flex;
            flex-direction: column;
            padding-top: 30px; /* Pushed content down */
            box-sizing: border-box; /* Ensure padding is included in height */
        }
        .bg-car {
            position: absolute;
            top: 90px; /* Moved car up by 20px */
            right: 20px;
            width: 180px; /* Made car larger */
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px; /* Moved icons to the absolute top */
            color: white;
            font-size: 16px;
        }
        .location {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .location::before {
            content: "📍";
        }
        .header {
            padding: 50px 20px 20px; /* Pushed text down by 15px */
            color: white;
            flex-shrink: 0;
            z-index: 2;
            display: block; /* Explicitly set display for toggling */
        }
        .header h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding-top: 45px; /* Moved content down by 15px */
            position: relative;
            z-index: 2;
        }
        .ad-bar {
            background: #1f2937;
            color: white;
            padding: 10px 16px;
            font-size: 13px;
            border-radius: 16px 16px 0 0;
            margin: 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ad-tag {
            background: #374151;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
        }
        .card {
            background: white;
            margin: 0 16px;
            padding: 24px 20px;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            /* flex-grow and overflow removed to allow natural height and bottom blue space */
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer; /* Add pointer cursor */
        }
        .icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .icon.blue { background: #409eff; }
        .icon.red { background: #f56c6c; }
        .icon.orange { background: #e6a23c; }
        .icon.purple { background: #722ed1; }
        .icon.green { background: #00c48c; }
        .label {
            font-size: 13px;
            color: #333;
            text-align: center;
            font-weight: 500;
        }
        .tabbar {
            margin-top: auto; /* Pushes tabbar to the bottom */
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 24px;
            border-top: 1px solid #f0f0f0;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #909090;
            font-size: 12px;
        }
        .tab-item.active {
            color: #409eff;
        }
        .tab-item .icon {
            width: 24px;
            height: 24px;
            background: transparent;
            font-size: 20px;
            box-shadow: none;
        }

        /* --- Modal Styles --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            transform: scale(0.95);
            opacity: 0;
            transition: all 0.3s ease;
            overflow: hidden; /* CRITICAL FIX: This ensures the header corners are clipped correctly */
        }
        .modal.active .modal-content {
            opacity: 1;
            transform: scale(1);
        }
        .modal-header {
            display: flex;
            align-items: center;
            background: #409eff;
            color: white;
            padding: 12px 15px;
            margin: -20px -20px 20px; /* Use negative margin to create the full-width bar */
        }
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 0;
            margin-right: 15px;
            cursor: pointer;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: white;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #606266;
            font-size: 14px;
        }
        .form-group input, .modal-body input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 12px;
        }
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .checkbox-row input {
            width: auto;
            margin-bottom: 0;
        }
        .msg {
            margin-top: 12px;
            padding: 12px;
            background: #f5f9ff;
            border-radius: 8px;
            color: #409eff;
            font-size: 14px;
        }
        .spot-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 12px;
        }
        .spot {
            padding: 18px 0;
            border-radius: 10px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
        }
        .available { background: #edf7ff; color: #0088cc; }
        .occupied { background: #fff0f0; color: #f56c6c; }
        .reserved { background: #fff7e6; color: #e69f00; }
        .special { border: 2px solid #409eff; }

        /* --- Page Styles --- */
        .page {
            display: none; /* Hide pages by default */
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #409eff;
        }
        .page.active {
            display: flex; /* Show active page */
        }
        .records-header {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: white;
            flex-shrink: 0;
            padding-top: 20px; /* Align with status bar */
        }
        .records-header .modal-title {
            font-size: 18px;
            font-weight: 600;
        }
        .records-list {
            flex-grow: 1;
            background: white;
            list-style: none;
            padding: 10px;
            margin: 0;
            overflow-y: auto;
            border-radius: 16px 16px 0 0;
        }
        .records-list li {
            padding: 15px 10px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .records-tabs {
            display: flex;
            background: #409eff;
            padding: 0 20px 10px;
        }
        .tab-button {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.7;
            border-bottom: 2px solid transparent;
        }
        .tab-button.active {
            opacity: 1;
            font-weight: 600;
            border-bottom-color: white;
        }
        .records-content {
            flex-grow: 1;
            background: #f0f2f5;
            padding: 10px;
            overflow-y: auto;
            border-radius: 16px 16px 0 0;
        }
        #personal-records-section {
            display: none; /* Hidden by default */
        }
        .search-form {
            display: flex;
            gap: 10px;
            padding: 10px;
        }
        .search-form input {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 15px;
        }
        .search-form button {
            padding: 12px 20px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .record-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .record-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .record-card-plate {
            font-weight: bold;
            font-size: 16px;
        }
        .record-card-fee {
            font-weight: bold;
            font-size: 18px;
            color: #f56c6c;
        }
        .record-card-body {
            font-size: 13px;
            color: #606266;
            line-height: 1.6;
        }
        .record-card-body div {
            display: flex;
            justify-content: space-between;
        }
        .record-card-body span:first-child {
            color: #909399;
        }
        .no-records {
            text-align: center;
            padding: 40px;
            color: #909399;
        }

        .stats-content {
            flex-grow: 1;
            background: white;
            padding: 20px;
            border-radius: 16px 16px 0 0;
        }
        .no-stats-placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #909399;
        }
        .stats-icon {
            font-size: 60px;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f4f5;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .stats-primary-text {
            font-size: 16px;
            color: #303133;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .stats-secondary-text {
            font-size: 14px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<div class="mobile-frame">
    <div class="phone">
        <!-- Page 1: Main -->
        <div id="main-page" class="page active">
            <div class="status-bar">
                <div class="location">珠海</div>
                <div> 📶 🔋</div>
            </div>

            <img class="bg-car" src="https://www.freepnglogos.com/uploads/car-png/car-png-large-images-40.png" alt="Car illustration">

            <div class="header">
            <h1>停车更方便</h1>
            <p>快速缴费，找车</p>
        </div>

            <div class="main-content">
                <div class="ad-bar">
                <span class="ad-tag">广告</span>
                <span>找车位，用XXX，方便快捷停车更方便</span>
            </div>

            <div class="card">
                <div class="grid">
                    <div class="item" onclick="openModal('reserve')">
                        <div class="icon purple">📅</div>
                        <div class="label">停车预约</div>
                    </div>

                    <div class="item" onclick="openModal('enter')">
                        <div class="icon green">✅</div>
                        <div class="label">确认入场</div>
                    </div>

                    <div class="item" onclick="openModal('spot')">
                        <div class="icon red">P</div>
                        <div class="label">空泊位导航</div>
                    </div>

                    <div class="item" onclick="openModal('find')">
                        <div class="icon blue">🚗</div>
                        <div class="label">便捷寻车</div>
                    </div>

                    <div class="item" onclick="openModal('pay')">
                        <div class="icon green">🅿️</div>
                        <div class="label">停车缴费</div>
                    </div>
                    <div class="item" onclick="showPage('records-page')">
                        <div class="icon orange">📋</div>
                        <div class="label">收费记录</div>
                    </div>
                    <div class="item" onclick="showPage('stats-page')">
                        <div class="icon blue">📊</div>
                        <div class="label">数据统计</div>
                    </div>
                </div>
            </div>
            </div>
        </div>

        <!-- Page 2: Records -->
        <div id="records-page" class="page">
            <div class="status-bar">
                 <div class="location">珠海</div>
                 <div> 📶 🔋</div>
            </div>
            <div class="records-header">
                <button class="back-btn" onclick="showPage('main-page')">←</button>
                <h2 class="modal-title">收费记录</h2>
            </div>
            <div class="records-tabs">
                <button id="tab-all" class="tab-button active" onclick="switchRecordTab('all')">所有车辆</button>
                <button id="tab-personal" class="tab-button" onclick="switchRecordTab('personal')">个人查询</button>
            </div>
            <div class="records-content">
                <div id="all-records-section">
                    <div id="all_records_list"></div>
                </div>
                <div id="personal-records-section">
                    <div class="search-form">
                        <input type="text" id="personal_plate_input" placeholder="请输入车牌号">
                        <button onclick="searchPersonalRecords()">查询</button>
                    </div>
                    <div id="personal_records_list"></div>
                </div>
            </div>
        </div>

        <!-- Page 3: Stats -->
        <div id="stats-page" class="page">
            <div class="status-bar">
                 <div class="location">珠海</div>
                 <div> 📶 🔋</div>
            </div>
            <div class="records-header">
                <button class="back-btn" onclick="showPage('main-page')">←</button>
                <h2 class="modal-title">数据统计</h2>
            </div>
            <div class="stats-content">
                <div id="stats-chart-container" style="width: 100%; height: 400px; display: none;"></div>
                <div id="no-stats-data" class="no-stats-placeholder">
                    <div class="stats-icon">📊</div>
                    <p class="stats-primary-text">暂无停车数据</p>
                    <p class="stats-secondary-text">产生停车记录后将自动显示图表</p>
                </div>
            </div>
        </div>

        <!-- Modals remain outside the pages but inside the phone -->
        <div class="modal" id="reserve">
            <div class="modal-content">
                <div class="modal-header">
                    <button class="back-btn" onclick="closeModal('reserve')">←</button>
                    <h2 class="modal-title">停车预约</h2>
                </div>
                <div class="form-group">
                    <label for="r_plate">车牌号</label>
                    <input id="r_plate" placeholder="输入车牌">
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="r_special">
                    <label for="r_special">特殊车辆</label>
                </div>
                <button class="btn-primary" onclick="doReserve()">确认预约</button>
                <div class="msg" id="r_msg"></div>
            </div>
        </div>
        <div class="modal" id="enter">
            <div class="modal-content">
                <div class="modal-header">
                    <button class="back-btn" onclick="closeModal('enter')">←</button>
                    <h2 class="modal-title">确认入场</h2>
                </div>
                <div class="form-group">
                    <label for="e_plate">车牌号</label>
                    <input placeholder="输入车牌" id="e_plate">
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="e_special">
                    <label for="e_special">特殊车辆</label>
                </div>
                <button class="btn-primary" onclick="doEnter()">确认入场</button>
                <div class="msg" id="e_msg"></div>
            </div>
        </div>
        <div class="modal" id="spot">
            <div class="modal-content">
                <div class="modal-header">
                    <button class="back-btn" onclick="closeModal('spot')">←</button>
                    <h2 class="modal-title">空泊位导航</h2>
                </div>
                <div class="spot-grid" id="spot_grid"></div>
            </div>
        </div>
        <div class="modal" id="find">
            <div class="modal-content">
                <div class="modal-header">
                    <button class="back-btn" onclick="closeModal('find')">←</button>
                    <h2 class="modal-title">便捷寻车</h2>
                </div>
                <div class="form-group">
                    <label for="f_plate">车牌号</label>
                    <input placeholder="输入车牌" id="f_plate">
                </div>
                <button class="btn-primary" onclick="doFindCar()">查询位置</button>
                <div class="msg" id="f_msg"></div>
            </div>
        </div>
        <div class="modal" id="pay">
            <div class="modal-content">
                <div class="modal-header">
                    <button class="back-btn" onclick="closeModal('pay')">←</button>
                    <h2 class="modal-title">停车缴费</h2>
                </div>
                <div class="form-group">
                    <label for="p_plate">车牌号</label>
                    <input placeholder="输入车牌" id="p_plate">
                </div>
                <button class="btn-primary" onclick="doExit()">确认缴费离场</button>
                <div class="msg" id="p_msg"></div>
            </div>
        </div>
    </div>
</div>

<script>
let currentPage = 'main-page';

function showPage(pageId) {
    document.getElementById(currentPage).classList.remove('active');
    document.getElementById(pageId).classList.add('active');
    currentPage = pageId;

    if (pageId === 'records-page') {
        // Default to 'all' tab when showing records page
        switchRecordTab('all');
    }
    if (pageId === 'stats-page') {
        loadStats();
    }
}

function openModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
        modal.classList.add('active');
        if(modalId === 'spot') loadSpot();
    }
}

function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
        modal.classList.remove('active');
    }
}

function switchRecordTab(tab) {
    const allTab = document.getElementById('tab-all');
    const personalTab = document.getElementById('tab-personal');
    const allSection = document.getElementById('all-records-section');
    const personalSection = document.getElementById('personal-records-section');

    if (tab === 'all') {
        allTab.classList.add('active');
        personalTab.classList.remove('active');
        allSection.style.display = 'block';
        personalSection.style.display = 'none';
        loadRecords('all_records_list'); // Load all records
    } else {
        allTab.classList.remove('active');
        personalTab.classList.add('active');
        allSection.style.display = 'none';
        personalSection.style.display = 'block';
        // Clear personal list until a search is made
        document.getElementById('personal_records_list').innerHTML = '<div class="no-records">请输入车牌号进行查询</div>';
    }
}

function searchPersonalRecords() {
    const plate = document.getElementById('personal_plate_input').value;
    if (!plate) {
        alert('请输入车牌号');
        return;
    }
    loadRecords('personal_records_list', plate);
}

async function loadRecords(listId, plate = null) {
    const list = document.getElementById(listId);
    list.innerHTML = '<div class="no-records">加载中...</div>'; // Show loading indicator
    let url = '/api/records';
    if (plate) {
        url += `?plate=${plate}`;
    }

    try {
        const response = await fetch(url);
        const records = await response.json();
        list.innerHTML = ''; // Clear list

        if (records && records.length > 0) {
            records.forEach(rec => {
                const card = document.createElement('div');
                card.className = 'record-card';

                const fee = rec.fee !== null ? `¥ ${rec.fee.toFixed(2)}` : '进行中';
                const entryTime = rec.entry_time || 'N/A';
                const exitTime = rec.exit_time || 'N/A';
                const duration = rec.duration_formatted || 'N/A';

                card.innerHTML = `
                    <div class="record-card-header">
                        <span class="record-card-plate">${rec.plate}</span>
                        <span class="record-card-fee">${fee}</span>
                    </div>
                    <div class="record-card-body">
                        <div><span>入场时间</span><span>${entryTime}</span></div>
                        <div><span>支付时间</span><span>${exitTime}</span></div>
                        <div><span>停车时长</span><span>${duration}</span></div>
                    </div>
                `;
                list.appendChild(card);
            });
        } else {
            list.innerHTML = '<div class="no-records">暂无相关记录</div>';
        }
    } catch (error) {
        console.error('Error loading records:', error);
        list.innerHTML = '<div class="no-records">加载记录失败</div>';
    }
}

async function loadSpot() {
    let r = await fetch('/spot');
    let d = await r.json();
    let g = document.getElementById('spot_grid');
    g.innerHTML = '';
    d.spots.forEach(s => {
        let div = document.createElement('div');
        div.className = 'spot ' + s.status;
        if(d.special.includes(s.id)) div.classList.add('special');
        div.innerText = s.id;
        g.appendChild(div);
    });
}
async function doReserve() {
    let p = document.getElementById('r_plate').value;
    let s = document.getElementById('r_special').checked ? 1 : 0;
    let res = await fetch('/reserve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `plate=${p}&special=${s}`
    });
    let d = await res.json();
    document.getElementById('r_msg').innerText = d.msg;
}

async function doEnter() {
    let p = document.getElementById('e_plate').value;
    let s = document.getElementById('e_special').checked ? 1 : 0;
    let res = await fetch('/enter', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `plate=${p}&special=${s}`
    });
    let d = await res.json();
    document.getElementById('e_msg').innerText = d.msg;
}

async function doFindCar() {
    let p = document.getElementById('f_plate').value;
    let res = await fetch('/find_car', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `plate=${p}`
    });
    let d = await res.json();
    document.getElementById('f_msg').innerText = d.msg;
}

let statsChart;
async function loadStats() {
    const chartContainer = document.getElementById('stats-chart-container');
    const noDataPlaceholder = document.getElementById('no-stats-data');

    // Ensure ECharts is loaded
    if (typeof echarts == 'undefined') {
        console.error('ECharts is not loaded');
        return;
    }

    try {
        const response = await fetch('/api/stats');
        const data = await response.json();

        const hasData = data.vehicle_data && data.vehicle_data.some(d => d > 0);

        if (hasData) {
            chartContainer.style.display = 'block';
            noDataPlaceholder.style.display = 'none';

            if (statsChart) {
                statsChart.dispose();
            }
            statsChart = echarts.init(chartContainer);
            const option = {
                tooltip: {
                    trigger: 'axis',
                    formatter: function (params) {
                        const dataIndex = params[0].dataIndex;
                        const revenue = data.revenue_data[dataIndex];
                        return `${params[0].name}<br/>车辆数: ${params[0].value}<br/>收入: ${revenue.toFixed(2)}元`;
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: data.labels
                },
                yAxis: {
                    type: 'value',
                    name: '车辆数'
                },
                series: [{
                    data: data.vehicle_data,
                    type: 'line',
                    smooth: true,
                    areaStyle: {}
                }]
            };
            statsChart.setOption(option);
        } else {
            chartContainer.style.display = 'none';
            noDataPlaceholder.style.display = 'flex';
        }
    } catch (error) {
        console.error('Error loading stats:', error);
        chartContainer.style.display = 'none';
        noDataPlaceholder.style.display = 'flex';
        noDataPlaceholder.querySelector('.stats-primary-text').textContent = '加载数据失败';
    }
}

async function doExit() {
    const plate = document.getElementById('p_plate').value;
    const msgDiv = document.getElementById('p_msg');
    
    if (!plate) {
        msgDiv.textContent = '请输入车牌号';
        return;
    }

    try {
        const formData = new FormData();
        formData.append('plate', plate);

        const response = await fetch('/api/pay', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();

        if (data.code === 0) {
            msgDiv.innerHTML = `
                        缴费成功！<br>
                        入场时间: ${data.entry_time}<br>
                        离场时间: ${data.exit_time}<br>
                        停车时长: ${data.duration_minutes} 分钟<br>
                        费用: ${data.fee.toFixed(2)} 元
                    `;
            // Clear input after success
            document.getElementById('p_plate').value = '';
        } else {
            msgDiv.textContent = data.msg;
        }
    } catch (error) {
        console.error('Payment failed:', error);
        msgDiv.textContent = '请求失败，请检查网络或联系管理员。';
    }
}
